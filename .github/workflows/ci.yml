# Lint, tipos, tests (unitarios y de integración contra PostgreSQL) y build
# en cada push y pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: turnero
          POSTGRES_PASSWORD: turnero
          POSTGRES_DB: turnero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U turnero -d turnero"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://turnero:turnero@localhost:5432/turnero
      TEST_DATABASE_URL: postgresql://turnero:turnero@localhost:5432/turnero_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: Tests de integración
        run: npm run test:integration

      - name: Migraciones
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build
